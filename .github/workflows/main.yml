name: Build and Push to ACR
on: workflow_dispatch
permissions: 
  id-token: write
  contents: write
env:
  IMAGE_NAME: vivek-axion-ui
  VERSION: v${{github.run_number}}
  CLIENT_ID: ${{secrets.AZURE_CLIENT_ID}}
  TENANT_ID: ${{secrets.AZURE_TENANT_ID}}
  SUBSCRIPTION_ID: ${{secrets.AZURE_SUBSCRIPTION_ID}}
  ACR_SERVER: ${{secrets.ACR_NAME}}
jobs:
  Build-and-push:
    name: build the image and push to the acr
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Azure Login
        uses: Azure/login@v3
        with:
          client-id: ${{env.CLIENT_ID}}
          tenant-id: ${{env.TENANT_ID}}
          subscription-id: ${{env.SUBSCRIPTION_ID}}

      - name: Login ACR
        run: az acr login --name ${{env.ACR_SERVER}}

      - name: tag image
        run: docker build -t ${{env.ACR_SERVER}}/${{env.IMAGE_NAME}}:${{env.VERSION}} .

      - name: push to acr
        run: docker push ${{env.ACR_SERVER}}/${{env.IMAGE_NAME}}:${{env.VERSION}}
      # ---------------------------------
      # Update deployment.yaml
      # ---------------------------------
      - name: Update Kubernetes Manifest
        shell: powershell
        run: |
          $file = "manifests/axion-ui-deployment.yaml"
      
          $newImage = "${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}"
      
          (Get-Content $file) `
            -replace 'image:.*', "image: $newImage" |
            Set-Content $file
      
          Write-Host "Updated deployment.yaml"
      
          Get-Content $file

      # ---------------------------------
      # Commit changes back
      # ---------------------------------
      - name: Commit and Push Changes
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"

          git add manifests/axion-ui-deployment.yaml

          git commit -m "Update image to ${{ env.VERSION }}"

          git push

      - name: deploy
        run: kubectl apply -f manifests/axion-ui-deployment.yaml
  
